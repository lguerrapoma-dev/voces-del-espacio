{% extends "base.html" %}{% block content %}<section class="panel"><h1>{{ "Crear cuenta" if mode=="registro" else "Iniciar sesión" }}</h1><form method="post">{% if mode=="registro" %}<label>Nombre de usuario</label><input name="username" required maxlength="60"><label>Correo electrónico</label><input type="email" name="email" required><label>Contraseña (mínimo 8 caracteres)</label><input type="password" name="password" minlength="8" required>{% else %}<label>Usuario o correo</label><input name="identity" required><label>Contraseña</label><input type="password" name="password" required>{% endif %}<button>{{ "Registrarme" if mode=="registro" else "Ingresar" }}</button></form></section>{% endblock %}
